spring.datasource.url=jdbc:h2:mem:dermavet
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=${H2_PASSWORD:dev-password}

spring.jpa.show-sql=true

spring.h2.console.enabled=true

dermavet.admin-username=${ADMIN_USERNAME:admin}
dermavet.admin-password=${ADMIN_PASSWORD:dev-password}