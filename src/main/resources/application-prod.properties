# Aktivan u Docker Compose-u (SPRING_PROFILES_ACTIVE=prod) - podaci ostaju sacuvani na disku
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dermavet}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:dermavet}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
